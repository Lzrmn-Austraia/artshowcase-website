<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Art Showcase | Multicultural Homepage Preview</title>
  <style>
    *{box-sizing:border-box}html,body{margin:0;background:#efe9df;font-family:Arial,Helvetica,sans-serif;color:#1b1b1b}
    .preview-note{position:sticky;top:0;z-index:20;background:#171d17;color:#fff;padding:10px 14px;text-align:center;font-size:14px;line-height:1.35;box-shadow:0 2px 10px rgba(0,0,0,.2)}
    .preview-note strong{color:#f4b27a}
    .stage{width:min(100%,941px);margin:0 auto;position:relative;background:#fff;box-shadow:0 18px 55px rgba(0,0,0,.18)}
    .mockup{display:block;width:100%;height:auto}
    .artist-overlay{position:absolute;left:33.2%;top:47.1%;width:16.7%;background:#fff;border:2px solid #c55e3f;border-radius:7px;overflow:hidden;box-shadow:0 8px 25px rgba(0,0,0,.24);z-index:5}
    .artist-overlay img{display:block;width:100%;aspect-ratio:1/1.03;object-fit:cover;object-position:center top}
    .artist-overlay .caption{padding:7px 8px 8px;background:#fff;line-height:1.15}
    .artist-overlay .name{font-weight:800;font-size:clamp(8px,1.1vw,14px)}
    .artist-overlay .role{margin-top:3px;font-size:clamp(7px,.9vw,11px);color:#655}
    .artist-overlay .tag{margin-top:6px;padding:5px;border:1px solid #c55e3f;color:#a7472d;border-radius:4px;text-align:center;font-weight:700;font-size:clamp(7px,.8vw,10px)}
    @media(max-width:620px){.preview-note{font-size:12px;padding:8px 10px}.stage{width:100%;box-shadow:none}.artist-overlay{left:32.7%;top:47.0%;width:18.3%;border-width:1px}.artist-overlay .caption{padding:4px}.artist-overlay .name{font-size:7px}.artist-overlay .role{font-size:6px}.artist-overlay .tag{font-size:6px;padding:3px;margin-top:3px}}
  </style>
</head>
<body>
  <div class="preview-note"><strong>PREVIEW ONLY</strong> — multicultural Art Showcase homepage. The live homepage has not been changed.</div>
  <main class="stage">
    <img class="mockup" src="https://raw.githubusercontent.com/Lzrmn-Austraia/artshowcase-website/8b3c8dbf69cc1ea7de464eb98c27cddb6e7335da/public/artshowcase-multicultural-preview.jpg" alt="Art Showcase multicultural marketplace homepage preview">
    <section class="artist-overlay" aria-label="Featured Indigenous artist">
      <img src="https://raw.githubusercontent.com/Lzrmn-Austraia/artshowcase-website/8b3c8dbf69cc1ea7de464eb98c27cddb6e7335da/public/kamilaroi-cain-binge.png" alt="Kamilaroi Cain-Binge">
      <div class="caption"><div class="name">Kamilaroi Cain-Binge</div><div class="role">First Nations Artist</div><div class="tag">Visit Artist Store</div></div>
    </section>
  </main>
</body>
</html>
