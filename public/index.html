<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>The ARTS | Aboriginal &amp; Torres Strait Islander Art Hub</title>
  <meta name="description" content="A showcase for Aboriginal and Torres Strait Islander artists, their stories, artwork and products.">
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; background: #f5f0e6; }
    body { font-family: Arial, Helvetica, sans-serif; }
    .homepage {
      position: relative;
      width: min(100%, 1536px);
      margin: 0 auto;
      line-height: 0;
      background: #f5f0e6;
    }
    .homepage-image {
      display: block;
      width: 100%;
      height: auto;
      user-select: none;
    }
    .hotspot {
      position: absolute;
      z-index: 2;
      display: block;
      border-radius: 7px;
      cursor: pointer;
    }
    .hotspot:focus-visible {
      outline: 4px solid #ffffff;
      box-shadow: 0 0 0 8px #b94516;
    }
    .artists-nav { left: 33.8%; top: 2.8%; width: 5.6%; height: 4.1%; }
    .meet-artists { left: 23.9%; top: 36.7%; width: 11.1%; height: 4.8%; }
    .view-all { left: 86.7%; top: 61.4%; width: 9%; height: 3.7%; }
    .artist-card { top: 65.8%; height: 18.2%; }
    .artist-ngaire { left: 3.5%; width: 18.2%; }
    .artist-jarred { left: 22.4%; width: 17.6%; }
    .artist-kamilaroi { left: 40.7%; width: 17.8%; }
    .artist-tommy { left: 59.2%; width: 17.5%; }
    .artist-leah { left: 77.5%; width: 18.3%; }
    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }
  </style>
</head>
<body>
  <main class="homepage">
    <img
      class="homepage-image"
      src="/artshowcase-homepage.png"
      width="1536"
      height="1024"
      alt="The ARTS Aboriginal and Torres Strait Islander Art Hub homepage"
      draggable="false"
    >

    <a class="hotspot artists-nav" href="/artists.html"><span class="sr-only">Artists</span></a>
    <a class="hotspot meet-artists" href="/artists.html"><span class="sr-only">Meet our artists</span></a>
    <a class="hotspot view-all" href="/artists.html"><span class="sr-only">View all artists</span></a>

    <a class="hotspot artist-card artist-ngaire" href="/artists/ngaire-j.html"><span class="sr-only">View Ngaire J.</span></a>
    <a class="hotspot artist-card artist-jarred" href="/artists/jarred-m.html"><span class="sr-only">View Jarred M.</span></a>
    <a class="hotspot artist-card artist-kamilaroi" href="/artists/kamilaroi-cain-binge.html"><span class="sr-only">View Kamilaroi Cain-Binge</span></a>
    <a class="hotspot artist-card artist-tommy" href="/artists/tommy-r.html"><span class="sr-only">View Tommy R.</span></a>
    <a class="hotspot artist-card artist-leah" href="/artists/leah-w.html"><span class="sr-only">View Leah W.</span></a>
  </main>

</html>
